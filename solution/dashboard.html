<!DOCTYPE html>
<!-- CRED flavour theme: warm ivory + maroon + gold (structure: design-md/linear.app/DESIGN.md) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRED Collections — CEO Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<!-- CRED flavour theme: warm ivory + maroon + gold (replaces near-black Linear canvas) -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap');
  :root{
    --canvas:#FBF6EF; --s1:#FFFFFF; --s2:#FFFDF8; --s3:#F5EAD9;
    --hairline:#EADBC4; --hairline-strong:#D9C39A;
    --ink:#2A1608; --muted:#5C4A36; --subtle:#8A7560; --tertiary:#AB957A;
    --primary:#8C1D2F; --primary-hover:#A9243A; --primary-focus:#C9A227;
    --gold:#C9A227; --gold-soft:#F3E3B3; --success:#1E7A3C;
    --t1:#1E7A3C; --t2:#8C1D2F; --t3:#B45309; --t4:#1D4ED8; --t5:#0E7490; --t6:#A16207;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--canvas);background-image:radial-gradient(#EADBC4 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:Inter,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;letter-spacing:-0.05px;-webkit-font-smoothing:antialiased}
  a{color:var(--ink);text-decoration:none}
  a:focus-visible,button:focus-visible{outline:2px solid var(--primary-focus);outline-offset:2px}
  /* top-nav: deep maroon with gold wordmark dot */
  .topnav{position:sticky;top:0;z-index:50;height:56px;background:linear-gradient(90deg,#2A080E,#3D0C11 60%,#5C1220);border-bottom:2px solid var(--gold)}
  .topnav-inner{max-width:1280px;margin:0 auto;height:56px;padding:0 24px;display:flex;align-items:center;gap:24px}
  .wordmark{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:0.2px;white-space:nowrap;color:#FFF7E6}
  .wordmark .dot{width:10px;height:10px;border-radius:9999px;background:var(--gold);box-shadow:0 0 8px var(--gold);flex:none}
  .navlinks{display:flex;gap:20px;margin:0 auto}
  .navlinks a{font-size:14px;color:#EADBC4}
  .navlinks a:hover{color:#fff}
  .nav-actions{display:flex;gap:8px;margin-left:auto}
  .btn{font-size:14px;font-weight:600;line-height:1.2;border-radius:9999px;padding:8px 16px;border:1px solid transparent;cursor:pointer;min-height:40px;display:inline-flex;align-items:center}
  .btn-secondary{background:transparent;color:#FFF7E6;border-color:var(--gold)}
  .btn-secondary:hover{background:rgba(201,162,39,0.15)}
  .btn-primary{background:var(--gold);color:#2A080E}
  .btn-primary:hover{background:#E0B93B}
  .wrap{max-width:1280px;margin:0 auto;padding:0 24px 64px}
  /* hero: maroon -> ember -> gold gradient card */
  .hero{margin-top:24px;padding:40px 32px 32px;border-radius:20px;background:linear-gradient(120deg,#2A080E 0%,#6B1220 55%,#B45309 100%);color:#FFF7E6;box-shadow:0 12px 32px rgba(60,10,20,0.25)}
  .eyebrow{font-size:13px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold-soft);margin:0 0 12px}
  .hero h1{margin:0;font-family:Fraunces,Georgia,serif;font-size:40px;font-weight:600;line-height:1.15;letter-spacing:-0.5px;max-width:860px}
  .hero h1 .accent{color:var(--gold-soft);font-style:italic}
  .lead{margin:12px 0 0;font-size:17px;font-weight:400;line-height:1.5;color:#F3E3D3;max-width:860px}
  .verdict{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:#FFF7E6;color:#5C1220;font-weight:700;font-size:14px;border-radius:9999px;padding:8px 16px}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  /* grids */
  .section{margin-top:40px}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 16px}
  .section-head h2{margin:0;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--primary)}
  .section-head span{font-size:12px;color:var(--subtle)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  /* flavour tiles: white cards, coloured top bar, emoji icon, soft lift */
  .tile{position:relative;background:var(--s1);border:1px solid var(--hairline);border-top:5px solid var(--tertiary);border-radius:16px;padding:22px 22px 20px;box-shadow:0 4px 14px rgba(90,60,20,0.08);transition:transform .15s ease,box-shadow .15s ease}
  .tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(90,60,20,0.14)}
  .tile.t1{border-top-color:var(--t1)} .tile.t2{border-top-color:var(--t2)} .tile.t3{border-top-color:var(--t3)}
  .tile.t4{border-top-color:var(--t4)} .tile.t5{border-top-color:var(--t5)} .tile.t6{border-top-color:var(--t6)}
  .tile .icon{font-size:22px;margin-right:8px}
  .tile h3{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:var(--subtle)}
  .tile .big{font-family:Fraunces,Georgia,serif;font-size:24px;font-weight:600;line-height:1.25;letter-spacing:-0.2px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .tile .big .sm{font-family:Inter,sans-serif;font-size:14px;font-weight:400;color:var(--subtle);letter-spacing:0}
  .tile .sub{font-size:14px;line-height:1.55;color:var(--muted);margin-top:10px}
  .tile .sub b{color:var(--ink);font-weight:600}
  .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-variant-numeric:tabular-nums}
  /* status-badge pills */
  .badge{display:inline-block;font-size:12px;font-weight:600;line-height:1.4;background:var(--s3);color:var(--muted);border:1px solid var(--hairline);border-radius:9999px;padding:3px 10px;margin-top:14px;letter-spacing:0.02em}
  .badge-success{background:#E5F4E9;color:var(--success);border-color:#9AD4AB}
  .badge-dot::before{content:"";display:inline-block;width:6px;height:6px;border-radius:9999px;background:currentColor;margin-right:6px;vertical-align:1px;opacity:0.8}
  /* chart cards */
  .card{background:var(--s1);border:1px solid var(--hairline);border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(90,60,20,0.08)}
  .card h3{margin:0 0 4px;font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:600;letter-spacing:-0.2px;line-height:1.25}
  .card .card-sub{margin:0 0 16px;font-size:14px;color:var(--subtle)}
  .card canvas{max-height:260px;width:100%}
  .card .note{font-size:12px;line-height:1.5;color:var(--subtle);margin:14px 0 0;border-top:1px dashed var(--hairline-strong);padding-top:12px}
  .card .note b{color:var(--muted);font-weight:600}
  /* alert: cream with maroon bar + gold edge */
  .alert{background:#FFF9EC;border:1px solid var(--hairline-strong);border-left:6px solid var(--primary);border-radius:14px;padding:24px;display:flex;gap:16px;align-items:flex-start;box-shadow:0 6px 18px rgba(140,29,47,0.12)}
  .alert-body{flex:1}
  .alert-title{margin:0;font-size:16px;font-weight:700;letter-spacing:-0.05px;color:#5C1220}
  .alert-title .mono{color:var(--primary)}
  .alert p{margin:8px 0 0;font-size:14px;color:var(--muted)}
  .alert-actions{display:flex;gap:8px;flex:none}
  footer{margin-top:48px;border-top:2px solid var(--hairline);padding:24px 0 8px;color:var(--subtle);font-size:12px;line-height:1.6}
  footer .mono{color:var(--tertiary);font-size:12px}
  details{margin-top:10px} summary{font-size:12px;color:var(--subtle);cursor:pointer}
  @media(max-width:1024px){.grid{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr 1fr}}
  @media(max-width:768px){
    .navlinks{display:none}
    .hero{padding:28px 20px} .hero h1{font-size:30px}
    .lead{font-size:16px}
    .grid{grid-template-columns:1fr}
    .charts{grid-template-columns:1fr}
    .alert{flex-direction:column}
    .nav-actions .btn-secondary{display:none}
  }
  @media print{.topnav,.alert-actions{display:none} body{background:#fff} .hero{box-shadow:none}}
</head>
<body>
<nav class="topnav" aria-label="Primary">
  <div class="topnav-inner">
    <a class="wordmark" href="#top"><span class="dot" aria-hidden="true"></span>CRED Collections</a>
    <div class="navlinks">
      <a href="#overview">Overview</a>
      <a href="#forensics">Forensics</a>
      <a href="#golden">Golden</a>
    </div>
    <div class="nav-actions">
      <button class="btn btn-secondary" type="button">Methodology</button>
      <button class="btn btn-primary" type="button">Open PTP queue</button>
    </div>
  </div>
</nav>

<div class="wrap" id="top">
  <header class="hero" id="overview">
    <p class="eyebrow">CEO dashboard &middot; Daily &middot; IST-normalised</p>
    <h1>Are we recovering more <span class="accent">per day, per row, per hour</span> — or just working more days and rows?</h1>
    <p class="lead">Golden logic only &middot; IST-normalised (UTC / Asia/Kolkata / Asia/Dubai &rarr; IST) &middot; Daily refresh</p>
    <div class="verdict">📢 Verdict: March was flat — the +11% is a calendar illusion</div>
    <div class="meta-row">
      <span class="badge">Golden SUCCESS <span class="mono">17,534</span></span>
      <span class="badge">Raw <span class="mono">17,880 &minus; 346 dups</span></span>
      <span class="badge badge-success badge-dot">Golden logic only</span>
    </div>
  </header>

  <section class="section" id="forensics" aria-label="Tiles">
    <div class="section-head"><h2>Recovery truth &middot; Jan&ndash;Jul</h2><span>6 tiles &middot; per-day + per-row first</span></div>
    <div class="grid">
      <div class="tile t1"><h3><span class="icon">💰</span>T1 — Golden Recovery YTD</h3><div class="big">₹126.8 Cr <span class="sm">(Jan–Jul)</span></div><div class="sub">Golden SUCCESS <b>17,534</b> &bull; Raw <span class="mono">17,880 &minus; 346 dups (&minus;1.94%, ~₹2.9 Cr overstatement)</span>.<br>The only revenue number the CEO quotes.</div><span class="badge badge-success badge-dot">TRUTH</span></div>
      <div class="tile t2" title="Detail: Welch t=0.085 p=0.93; permutation p=0.93 (B=20k); bootstrap 95% CI [-6.1%,+6.8%]. Feb n=28 sd 0.73M; Mar n=31 sd 0.84M."><h3><span class="icon">📉</span>T2 — True Growth (per-day)</h3><div class="big">March was flat</div><div class="sub">+0.29% per day — <b>statistically flat, not +11%</b>. The +11% is just February having fewer days.<br>Hover this tile for the formal test.</div><span class="badge">FLAT — not +11%</span><details><summary style="font-size:12px;color:var(--subtle);cursor:pointer">Test detail</summary><span class="mono" style="font-size:12px">₹6.076M/d Feb (28d) → ₹6.093M/d Mar (31d); p=0.93; CI [−6.1%,+6.8%]; Apr −4.2%/d; Jul +3.2%/d.</span></details></div>
      <div class="tile t3"><h3><span class="icon">⚙️</span>T3 — Efficiency per Row + per Hour</h3><div class="big">₹30,033 / row <span class="sm">&bull; ₹16,649 / hr</span></div><div class="sub">Feb <span class="mono">₹29,802</span> &rarr; Mar <span class="mono">₹30,033</span> (<b>+0.8% flat</b>). Rows <span class="mono">5,709 &rarr; 6,290 (+10.2% volume)</span>.<br><span class="mono">76,187</span> agent-hours Jan–Jul.</div><span class="badge">VOLUME WITHOUT LEVERAGE</span></div>
      <div class="tile t4" title="Detail: priority 1-10 seven-day conversion 1.56-2.16% (overall 1.83%), chi-square p=0.345 — no trend."><h3><span class="icon">📞</span>T4 — Funnel Health</h3><div class="big">No improvement anywhere</div><div class="sub">Answer rates, promise-kept rates, and our priority ranking were all <b>flat — the ranking can't pick winners</b>.<br>Hover for the test.</div><span class="badge">FLAT</span><details><summary style="font-size:12px;color:var(--subtle);cursor:pointer">Test detail</summary><span class="mono" style="font-size:12px">Contact 19–20%; PTP-kept ~25%; priority 7d 1.56–2.16%, p=0.345 (Forensic H).</span></details></div>
      <div class="tile t5"><h3><span class="icon">🚜</span>T5 — Field Outcome</h3><div class="big">Field PAID 16.32%</div><div class="sub"><span class="mono">4,080</span> PAID / <span class="mono">25,000</span> visits (~6 visits per PAID).<br>Hold as benchmark; don&rsquo;t expand field until A/B proves lift.</div><span class="badge">BENCHMARK</span></div>
      <div class="tile t6" style="border-style:dashed" title="Detail: never-targeted 43.69% vs targeted 43.05% (diff -0.64pp, p=0.35, CI [-2.00pp,+0.70pp]; MH -0.65pp). Untouched is not proven fruit."><h3><span class="icon">🧪</span>T6 — Coverage Gap ⚠ Idea to test</h3><div class="big"><span class="mono">6,656</span> accounts never contacted</div><div class="sub">They convert <b>no worse</b> than contacted ones — so this is <b>an idea to test, not a prize already won</b>.<br>Hover for the comparison.</div><span class="badge">HYPOTHESIS — needs the holdout test</span><details><summary style="font-size:12px;color:var(--subtle);cursor:pointer">Comparison detail</summary><span class="mono" style="font-size:12px">Never 43.69% vs targeted 43.05% (p=0.35); fresh DPD Mar ₹73.6M→₹89.5M easy-mix.</span></details></div>
    </div>
  </section>

  <section class="section" id="golden" aria-label="Charts">
    <div class="section-head"><h2>Illusion vs reality</h2><span>Fund actions only on the per-day line</span></div>
    <div class="charts">
      <div class="card"><h3>Illusion vs Reality (MoM %)</h3><p class="card-sub">Bars = raw MoM (distorted). Line = per-day MoM (truth).</p><canvas id="c1"></canvas><p class="note">Mar bar: <b>31d vs 28d + easy-mix (₹73.6M&rarr;₹89.5M fresh DPD 0–30)</b>. Fund actions only on the line, never the bars.</p></div>
      <div class="card"><h3>Golden Waterfall + Targeting Leverage</h3><p class="card-sub">Dedup first, then read leverage.</p><canvas id="c2"></canvas><p class="note">Raw <span class="mono">17,880</span> &rarr; <span class="mono">&minus;346</span> dups &rarr; Golden <span class="mono">17,534 (&minus;1.94%, ~₹2.9 Cr)</span>. Feb vs Mar: rows <span class="mono">+10.2%</span> but ₹/row <span class="mono">+0.8%</span>. TXN-reuse risk <span class="mono">4,297</span> refs excluded &middot; Agents <span class="mono">1,000</span> IDs &times; ~30 snapshots &middot; No vendor code change.</p></div>
    </div>
  </section>

  <section class="section" aria-label="Alert">
    <div class="alert" role="alert">
      <div class="alert-body">
        <p class="alert-title">STALE PTP — <span class="mono">4,128 / 4,415</span> OPEN PTPs past due (~93.5%, threshold 20%).</p>
        <p>Owner: Collections Ops &middot; SLA 7 days: clear or re-date. Prioritise stale PTPs + never-targeted high-propensity accounts in #4 rollout. Success = stale &lt; 20% and PTP-kept &ge; 25%.</p>
        <div class="meta-row"><span class="badge">SLA 7 days</span><span class="badge">Threshold 20%</span><span class="badge">Links to T6</span></div>
      </div>
      <div class="alert-actions"><button class="btn btn-primary" type="button">Open PTP recovery queue</button></div>
    </div>
  </section>

  <footer>Visual weight rule: solid tiles (T1–T5) = <b>HIGH-confidence arithmetic</b>; dashed T6 = <b>LOW-confidence hypothesis</b> (requires holdout). TXN-reuse <span class="mono">4,297</span> excluded &bull; Agents <span class="mono">1,000</span> IDs &times; ~30 snapshots &bull; No vendor change &bull; 3 zones &rarr; IST &bull; Golden: SUCCESS only, payment_id dedup, borrower earliest, agent min-joined, PTP +7d. Tests: <span class="mono">feb_mar_test.json (p=0.93)</span>, <span class="mono">stratified_uplift.json (p=0.35)</span>, priority <span class="mono">p=0.345</span>. Cost ₹1.2Cr + 50% split are flagged assumptions.</footer>
</div>

<script>
new Chart(document.getElementById('c1'),{type:'bar',data:{labels:['Feb','Mar','Apr','May','Jun','Jul'],datasets:[{label:'Raw MoM %',data:[-8.91,10.99,-7.66,4.83,-4.45,6.46],backgroundColor:'#D9A05B',borderRadius:6},{label:'Per-day MoM %',data:[0.61,0.29,-4.20,1.81,-1.54,3.21],type:'line',borderColor:'#8C1D2F',backgroundColor:'#8C1D2F',pointBackgroundColor:'#C9A227',pointBorderColor:'#8C1D2F',tension:.3,borderWidth:3,pointRadius:4}]},options:{plugins:{legend:{labels:{color:'#5C4A36',boxWidth:12,font:{size:12}}}},scales:{x:{grid:{color:'#EADBC4'},ticks:{color:'#8A7560',font:{size:12}}},y:{grid:{color:'#EADBC4'},ticks:{color:'#8A7560',font:{size:12}}}}}});
new Chart(document.getElementById('c2'),{type:'bar',data:{labels:['Raw SUCCESS','Dups removed','Golden SUCCESS','Feb rows (k)','Mar rows (k)'],datasets:[{label:'Count',data:[17880,-346,17534,5709,6290],backgroundColor:['#D9A05B','#8C1D2F','#1E7A3C','#0E7490','#C9A227'],borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:'#8A7560',font:{size:11}}},y:{grid:{color:'#EADBC4'},ticks:{color:'#8A7560',font:{size:12}}}}}});
</script>
</body>
</html>
